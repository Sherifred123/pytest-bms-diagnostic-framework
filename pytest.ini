[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --strict-markers -ra

markers =
    smoke: Smoke tests for basic connectivity and initialization
    safety: Critical electrical safety, over-voltage, and contactor shutdown tests
    diagnostic: Diagnostic Trouble Code (DTC) reading and clearing verification
    cell: Cell voltage balance, pack telemetry, and SoC accuracy tests
    stress: Communication drop, frame timeout, and fault recovery tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
